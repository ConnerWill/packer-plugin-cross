name: Build Images and Upload to GitHub Releases

on:
  push:
    tags:
      - v*
    branches:
      - master
      - development
  pull_request:
  schedule:
    # once a week
    - cron: '0 0 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - name: Retrieve cache
        id: cache-key
        uses: actions/cache@v4
        with:
          path: packer-plugin-cross
          key: key-${{ github.sha }}-1

      - name: Checkout
        if: steps.cache-key.outputs.cache-hit != 'true'
        uses: actions/checkout@v4

      - name: Set up Go
        if: steps.cache-key.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5.3.0
        with:
          go-version: '1.23'
        id: go

      - name: Get dependencies
        if: steps.cache-key.outputs.cache-hit != 'true'
        run: |
          go get -v -t -d ./...
          if [ -f Gopkg.toml ]; then
              curl https://raw.githubusercontent.com/golang/dep/master/install.sh | sh
              dep ensure
          fi

      - name: Build
        if: steps.cache-key.outputs.cache-hit != 'true'
        run: go build -v .

      - name: Cache binary
        if: steps.cache-key.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: packer-plugin-cross
          key: key-${{ github.sha }}-1

  test:
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        boards:
          # Uncomment boards as needed:
          # - bananapi-r1/archlinuxarm.pkr.hcl
          # - beaglebone-black/angstrom.pkr.hcl
          # - beaglebone-black/archlinuxarm.pkr.hcl
          # - beaglebone-black/debian.pkr.hcl
          # - beaglebone-black/ubuntu.pkr.hcl
          # - jetson-nano/ubuntu.pkr.hcl
          # - odroid-u3/archlinuxarm.pkr.hcl
          # - odroid-xu4/archlinuxarm.pkr.hcl
          # - odroid-xu4/ubuntu.pkr.hcl
          # - parallella/archlinuxarm.pkr.hcl
          # - parallella/ubuntu.pkr.hcl
          # - raspberry-pi/archlinuxarm.pkr.hcl
          # - raspberry-pi/raspbian.pkr.hcl
          # - raspberry-pi/raspbian-resize.pkr.hcl
          # - raspberry-pi/raspios-lite-arm.pkr.hcl
          # - raspberry-pi-3/archlinuxarm.pkr.hcl
          # - raspberry-pi-3/raspios-lite-arm64.pkr.hcl
          # - raspberry-pi-4/ubuntu_server_20.04_arm64.pkr.hcl
          - raspberry-pi-4/archlinuxarm.pkr.hcl
          # - rock-4b/debos-radxa.pkr.hcl
          # - wandboard/archlinuxarm.pkr.hcl
    name: Build ${{ matrix.boards }} image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch additional packages
        run: |
          sudo apt-get update
          sudo apt-get install fdisk gdisk qemu-user-static libarchive-tools tar qemu-utils

      - name: Install Packer
        uses: hashicorp-contrib/setup-packer@v3
        with:
          packer-version: 1.11.0

      - name: Retrieve cache
        uses: actions/cache@v4
        with:
          path: packer-plugin-cross
          key: key-${{ github.sha }}-1

      - name: Bring plugin in place
        run: |
          packer plugins install -path ./packer-plugin-cross "github.com/michalfita/cross"

      - name: Install packer plugins
        if: ${{ endsWith(matrix.boards, '.hcl') }}
        run: PACKER_LOG=1 packer init boards/${{ matrix.boards }}

      - name: Validate
        run: PACKER_LOG=1 packer validate boards/${{ matrix.boards }}

      - name: Build image
        run: |
          # Run the packer build. We assume that it outputs an image file named "output.img"
          PACKER_BINARY="$(which packer)"
          sudo PACKER_LOG=1 ${PACKER_BINARY} build boards/${{ matrix.boards }}

      # --- New steps to capture the built image ---
      - name: Prepare built image for artifact upload
        id: prepare_artifact
        run: |
          # Check if the expected built image exists
          if [ -f output.img ]; then
            # Sanitize the board name (replace '/' and '.' with '-')
            SANITIZED=$(echo "${{ matrix.boards }}" | sed 's/[\/\.]/-/g')
            ARTIFACT_NAME="image-${SANITIZED}.img"
            ls -al
            mv raspberry-pi-4.img "$ARTIFACT_NAME"
            echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          else
            echo "No built image found; skipping artifact upload." >&2
          fi

      - name: Upload built image artifact
        uses: actions/upload-artifact@v4
        if: steps.prepare_artifact.outputs.artifact_name != ''
        with:
          name: ${{ steps.prepare_artifact.outputs.artifact_name }}
          path: ${{ steps.prepare_artifact.outputs.artifact_name }}

  plugin-check:
    needs: compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5.3.0
        with:
          go-version: '1.23'
      - name: Retrieve cache
        uses: actions/cache@v4
        with:
          path: packer-plugin-cross
          key: key-${{ github.sha }}-1
      - name: check
        run: |
          make plugin-check

  # --- Release job using softprops/action-gh-release@v2 ---
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Download all built image artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          # Glob pattern to match all image files downloaded earlier
          files: |
            downloaded-artifacts/**/*.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

